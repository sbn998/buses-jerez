# Proceso diario de datos de Buses Jerez.
#
# Cada noche (04:00 UTC, de madrugada en Jerez) GitHub ejecuta el proceso de la
# carpeta pipeline/: descarga los horarios de Comujesa, los revisa y, si todo está
# bien, los publica en https://sbn998.github.io/buses-jerez/.
# Si la revisión falla, el trabajo "build" falla, no se publica nada y GitHub
# envía un correo al dueño del repositorio.
# También se puede lanzar a mano desde la pestaña Actions ("Run workflow").
name: Datos diarios

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca dos publicaciones a la vez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build-data
      # Trae el mapa del Release "mapa" (lo genera map.yml una vez al mes) y lo deja en
      # out/map/. La descarga se reintenta 3 veces por si GitHub falla un momento. Si aun
      # así algo falla (no hay Release, zip roto...), avisa con la causa real y publica los
      # horarios sin mapa: el mapa nunca debe impedir publicar los horarios.
      - name: Traer el mapa
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          download() {
            for attempt in 1 2 3; do
              rm -rf out/map
              if gh release download mapa --repo "$GITHUB_REPOSITORY" -D out/map --pattern '*' 2> map-error.txt; then
                return 0
              fi
              echo "Intento $attempt de 3 fallido: $(cat map-error.txt)"
              sleep 10
            done
            return 1
          }
          if download \
            && unzip -q out/map/fonts.zip -d out/map/fonts \
            && rm out/map/fonts.zip \
            && npm run write-style \
            && test -s out/map/jerez.pmtiles \
            && test -s out/map/style.json; then
            echo "Mapa listo en out/map/"
          else
            cause="$(cat map-error.txt 2>/dev/null)"
            rm -rf out/map
            echo "::warning::No se ha podido preparar el mapa, se publica sin él. Causa de la descarga: ${cause:-sin error de descarga (fallo al descomprimir, al escribir el estilo o faltan archivos)}"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pipeline/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
