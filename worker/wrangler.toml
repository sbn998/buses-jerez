# Configuración del Worker de Cloudflare que hace de intermediario con OpenRouteService.
# La clave ORS_API_KEY NO va aquí: se guarda como secreto con `npx wrangler secret put ORS_API_KEY`.
name = "buses-jerez-walk"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Caché de resultados (Workers KV). En la Task 4 se sustituye PON_AQUI_EL_ID por el id que
# imprime `npx wrangler kv namespace create WALK_CACHE`. Ese id no es secreto.
[[kv_namespaces]]
binding = "WALK_CACHE"
id = "PON_AQUI_EL_ID"
